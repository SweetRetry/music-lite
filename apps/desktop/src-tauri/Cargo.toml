[package]
name = "music-lite"
version = "0.1.0"
description = "A lightweight NetEase Cloud Music and QQ Music client"
authors = ["SweetRetry"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "music_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.12.4", features = ["tray-icon", "macos-private-api"] }
aes = "0.9.3"
ecb = { version = "0.2.1", features = ["alloc"] }
md5 = { package = "md-5", version = "0.11.0" }
hex = "0.4.3"
rand = "0.10.3"
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset"] }
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
aes-gcm = "0.11.1"
sha1 = "0.11.0"
base64 = "0.23.1"
plist = "1.10.1"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSToolbar", "NSWindow", "NSScreen", "NSGraphics", "NSEvent", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSDictionary", "NSValue", "NSError", "NSString", "NSURL"] }
